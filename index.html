<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a22">
<title>Handballcoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Startmenü: eine Karte pro Trainingsart. Farben wie in der App (aussenspieler/css/base.css). */
  :root{
    --bg:#121a22; --panel:#1b2530; --panel2:#243241; --line:#33465a;
    --text:#eef2f5; --muted:#93a3b3; --orange:#ff8a1f;
    --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body)}
  body{padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
  main{max-width:520px;margin:0 auto}
  h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1;margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
  h1 + p{color:var(--muted);margin:0 0 24px}
  nav{display:grid;gap:12px}
  nav a{display:block;padding:18px 18px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    border-left:5px solid var(--orange);color:inherit;text-decoration:none}
  nav a:active,nav a:hover{background:var(--panel2)}
  nav a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  nav b{display:block;font-family:var(--head);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.4px}
  nav span{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
</style>
</head>
<body>
<main>
  <h1>Handballcoach</h1>
  <p>Alleine trainieren: Aufgabe wählen, Handy aufs Stativ, los.</p>
  <!-- Neue Trainingsart = eine neue Zeile (Ordner mit eigener index.html). -->
  <nav id="trainings">
    <a href="aussenspieler/"><b>Außenspieler: Würfe</b><span>Zielansage, Technik-Check und Feedback per Sprache</span></a>
    <a href="siebenmeter/"><b>7-m-Wurf</b><span>Pfiff, Wurf in 3 Sekunden, Linie und Standbein werden geprüft</span></a>
    <a href="abwehr/"><b>Abwehr-Beinarbeit</b><span>Auf Zuruf verschieben, Reaktionszeit, Füße nicht kreuzen</span></a>
  </nav>
</main>
</body>
</html>
